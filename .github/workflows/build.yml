name: Native Studio Core build, tests, and release
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      hardware_tests:
        description: Run public hardware ROM measurements (native compatibility is incomplete)
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: python3 -m pip install Pillow
      - name: Verify ROM test protocols
        run: |
          python3 -m unittest discover -s tests -p test_extended_harness.py
          python3 -m unittest discover -s tests -p test_fetch_extended_suite.py
          python3 -m unittest discover -s tests -p test_rom_test_runner.py
          python3 -m unittest discover -s tests -p test_hardware_matrix.py
          python3 tests/test_headless_protocols.py --emulator build/gb_headless --demo demo.gb
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DGB_ENABLE_SANITIZERS=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
  coverage-feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DGB_BUILD_COVERAGE_FUZZER=ON -DBUILD_TESTING=OFF
      - run: cmake --build build --target gb_coverage_fuzzer --parallel 2
      - run: build/gb_coverage_fuzzer demo.gb build/corpus 30
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-loader-coverage-corpus
          path: build/corpus
  windows-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify Windows QA process handling
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_windows_qa.ps1
      - run: python -m pip install Pillow
      - name: Verify ROM test protocols on Windows
        run: |
          python -m unittest discover -s tests -p test_extended_harness.py
          python -m unittest discover -s tests -p test_fetch_extended_suite.py
          python -m unittest discover -s tests -p test_rom_test_runner.py
          python -m unittest discover -s tests -p test_hardware_matrix.py
          python tests/test_headless_protocols.py --emulator build/Release/gb_headless.exe --demo demo.gb
      - run: cmake --install build --config Release --prefix dist
      - name: Run native CPU rendering and demo checks
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File RUN_WINDOWS_QA.ps1 -OutputFolder build/windows-qa
      - name: Package portable Windows build and sources
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath GBStudio-Windows-x64.zip
          git archive --format=zip --prefix=GameBoy-Studio/ -o GameBoy-Studio-source.zip HEAD
          @('GBStudio-Windows-x64.zip','GameBoy-Studio-source.zip') | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_).Hash.ToLowerInvariant()
            "$hash  $_"
          } | Set-Content -Encoding ascii SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GBStudio-Windows-x64
          path: |
            GBStudio-Windows-x64.zip
            GameBoy-Studio-source.zip
            SHA256SUMS.txt
            build/windows-qa
  # Old reports were produced by a different hardware engine. Do not compare
  # Studio Core against those baselines or claim their pass rates for this build.
  hardware-measurements:
    if: github.event_name == 'workflow_dispatch' && inputs.hardware_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - run: cmake --build build --target gb_headless --parallel 2
      - run: python3 -m pip install Pillow
      - name: Measure DMG compatibility
        id: dmg
        continue-on-error: true
        run: python3 tests/run_rom_tests.py --emulator build/gb_headless --download --mooneye
      - name: Measure CGB compatibility
        id: cgb
        continue-on-error: true
        run: python3 tests/run_cgb_tests.py --emulator build/gb_headless --download
      - name: Measure extended hardware behavior
        id: extended
        continue-on-error: true
        run: |
          python3 tests/fetch_extended_suite.py --output build/extended-suite
          python3 tests/run_extended_tests.py --emulator build/gb_headless --suite build/extended-suite --report build/extended-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-hardware-measurements
          path: |
            build/rom-tests.json
            build/cgb-rom-tests.json
            build/extended-results.json
      - name: Report remaining hardware discrepancies
        if: steps.dmg.outcome != 'success' || steps.cgb.outcome != 'success' || steps.extended.outcome != 'success'
        run: |
          echo "Studio Core did not pass every requested hardware test. See the uploaded reports."
          exit 1
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [linux-tests, sanitizers, windows-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GBStudio-Windows-x64
          path: artifacts
      - name: Publish verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; preserving its verified assets."
            exit 0
          fi
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --title "GameBoy Studio $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
