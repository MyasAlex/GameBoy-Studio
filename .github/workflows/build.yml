name: Build and DMG compatibility
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: python3 -m pip install Pillow
      - run: python3 tests/run_rom_tests.py --emulator build/gb_headless --download --mooneye
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DMG-test-report
          path: build/rom-tests.json
  windows-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: cmake --install build --config Release --prefix dist
      - run: Compress-Archive -Path dist/* -DestinationPath GBStudio-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GBStudio-Windows-x64
          path: GBStudio-Windows-x64.zip
