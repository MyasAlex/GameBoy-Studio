name: Build, compatibility, and release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: python3 -m pip install Pillow
      - run: python3 tests/run_rom_tests.py --emulator build/gb_headless --download --mooneye
      - run: python3 tests/run_cgb_tests.py --emulator build/gb_headless --download
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GB-CGB-test-reports
          path: |
            build/rom-tests.json
            build/cgb-rom-tests.json
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DGB_ENABLE_SANITIZERS=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
  windows-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: cmake --install build --config Release --prefix dist
      - name: Package portable Windows build and sources
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath GBStudio-Windows-x64.zip
          git archive --format=zip --prefix=GameBoy-Studio/ -o GameBoy-Studio-source.zip HEAD
          @('GBStudio-Windows-x64.zip','GameBoy-Studio-source.zip') | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_).Hash.ToLowerInvariant()
            "$hash  $_"
          } | Set-Content -Encoding ascii SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GBStudio-Windows-x64
          path: |
            GBStudio-Windows-x64.zip
            GameBoy-Studio-source.zip
            SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [linux-tests, sanitizers, windows-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GBStudio-Windows-x64
          path: artifacts
      - name: Publish verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/* --verify-tag --title "GameBoy Studio $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md