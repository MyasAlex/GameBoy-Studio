name: Publish tested Windows preview
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Build, compatibility, and release run ID
        required: true
        type: string
      release_tag:
        description: Preview release tag
        required: true
        default: v1.0.0-preview.4
        type: string
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.build_run }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Verify the completed build and its source
        id: build
        shell: bash
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]
          gh run watch "$BUILD_RUN" --exit-status --interval 15
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > build-run.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('build-run.json'))
          assert run['conclusion'] == 'success'
          assert run['path'] == '.github/workflows/build.yml'
          assert run['head_repository']['full_name'] == os.environ['GH_REPO']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('source_sha=' + run['head_sha'] + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.build.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: GBStudio-Windows-x64
          path: release-files
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Verify files and assemble the complete package
        shell: bash
        run: |
          cd release-files
          sha256sum --check SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          root = pathlib.Path('.')
          staging = pathlib.Path('../complete-package')
          with zipfile.ZipFile('GameBoy-Studio-source.zip') as z:
              z.extractall(staging)
          dist = staging / 'GameBoy-Studio' / 'dist'
          with zipfile.ZipFile('GBStudio-Windows-x64.zip') as z:
              z.extractall(dist)
          with zipfile.ZipFile('GameBoy-Studio-complete.zip', 'w', zipfile.ZIP_DEFLATED, 6) as z:
              for p in sorted(staging.rglob('*')):
                  if p.is_file(): z.write(p, p.relative_to(staging))
          with zipfile.ZipFile('Windows-QA.zip', 'w', zipfile.ZIP_DEFLATED, 6) as z:
              for p in sorted((root / 'build').rglob('*')):
                  if p.is_file(): z.write(p, p.relative_to(root))
          names = ['GBStudio-Windows-x64.zip', 'GameBoy-Studio-source.zip',
                   'GameBoy-Studio-complete.zip', 'Windows-QA.zip',
                   'GBStudio.exe', 'gb_accuracy.dll', 'gb_pixel_filters.exe', 'gb_headless.exe']
          with open('SHA256SUMS.txt', 'w') as out:
              for name in names:
                  out.write(hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() + '  ' + name + '\n')
          PY
          sha256sum --check SHA256SUMS.txt
      - name: Publish the verified preview assets
        env:
          SOURCE_SHA: ${{ steps.build.outputs.source_sha }}
        shell: bash
        run: |
          cp docs/RELEASE_NOTES.md release-notes.md
          printf '\nWindows assets were built and tested by GitHub Actions: https://github.com/%s/actions/runs/%s\nSource commit: `%s`.\n' "$GH_REPO" "$BUILD_RUN" "$SOURCE_SHA" >> release-notes.md
          files=(release-files/GBStudio-Windows-x64.zip release-files/GameBoy-Studio-source.zip
                 release-files/GameBoy-Studio-complete.zip release-files/Windows-QA.zip
                 release-files/GBStudio.exe release-files/gb_accuracy.dll
                 release-files/gb_pixel_filters.exe release-files/gb_headless.exe release-files/SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > existing-release.json 2>/dev/null; then
            python3 - <<'PY'
          import json, os
          release = json.load(open('existing-release.json'))
          assert release['isDraft'], 'Refusing to replace an already published release'
          assert release['targetCommitish'] == os.environ['SOURCE_SHA'], 'Draft targets another commit'
          PY
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --title "GameBoy Studio $RELEASE_TAG — Windows x64" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --target "$SOURCE_SHA" --prerelease --title "GameBoy Studio $RELEASE_TAG — Windows x64" --notes-file release-notes.md
          fi
